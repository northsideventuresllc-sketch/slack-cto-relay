# /etc/tmpfiles.d/cto-relay.conf — runtime directories for the four relay programs.
# Control sockets: /run/cto-relay/<cto>/control.sock (0660, group cto-relay-admin).
# Brain broker sockets: /run/cto-relay/broker/<cto>.sock (0660, group cto-relay-<cto>).
d /run/cto-relay                  0755 root                  root            -
d /run/cto-relay/broker           0751 cto-relay-muse        cto-relay-muse  -
d /run/cto-relay/muse             0750 cto-relay-muse        cto-relay-admin -
d /run/cto-relay/claude           0750 cto-relay-claude      cto-relay-admin -
d /run/cto-relay/gemini           0750 cto-relay-gemini      cto-relay-admin -
d /run/cto-relay/axon-hermes      0750 cto-relay-axon-hermes cto-relay-admin -
